version: "3.5"
services:
  odoo:
    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ..:/workspace:cached
      - ../.vscode-server:/home/odoo/.vscode-server
      - ../.vscode-server-insiders:/home/odoo/.vscode-server-insiders
      - ${HOME}/.ssh:/home/odoo/.ssh:ro
      - ${SSH_AUTH_SOCK:-/tmp/ssh-fake-agent}:/ssh-agent
    environment:
      - SSH_AUTH_SOCK=/ssh-agent

    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"
