# Defaults for all prettier-supported languages.
# Prettier will complete this with settings from .editorconfig file.
bracketSpacing: false
printWidth: 88
proseWrap: always
tabWidth: 4
semi: true
trailingComma: "es5"
xmlWhitespaceSensitivity: "ignore"
plugins:
    - "@prettier/plugin-xml"
    - "prettier-plugin-sql"
overrides:
    - files: "*.xml"
      options:
          parser: "xml"
    - files: "*.sql"
      options:
          parser: "sql"
          language: "postgresql"
          keywordCase: "upper"
